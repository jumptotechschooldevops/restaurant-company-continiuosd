apiVersion: apps/v1
kind: Deployment

metadata:
  name: restaurant-company
  labels:
    app: restaurant-company

spec:
  # Run 2 copies of the application
  replicas: 2

  # Deployment manages Pods with this label
  selector:
    matchLabels:
      app: restaurant-company

  template:
    metadata:
      labels:
        app: restaurant-company

    spec:
      containers:
        - name: restaurant-company

          # Docker image stored in AWS ECR
          # Jenkins can update this image during CD
          image: 288673275952.dkr.ecr.us-east-2.amazonaws.com/restaurant-company:latest

          # Always check ECR for the latest image
          imagePullPolicy: Always

          # nginx inside the container listens on port 80
          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          # Check whether the application is ready
          # to receive traffic
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Check whether the application is still alive
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          # Resource configuration
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"

      # Give Kubernetes time to terminate the container cleanly
      terminationGracePeriodSeconds: 30
